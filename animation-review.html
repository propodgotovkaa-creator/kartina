<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка восьми анимаций</title><style>*{box-sizing:border-box}body{margin:0;background:#201e2a;color:#eee1c5;font:16px Arial,sans-serif}header{padding:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}button{background:#57465c;color:#fff1d7;border:1px solid #a68a63;padding:8px 12px;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#a77b42}main{text-align:center}h1{font-size:22px;margin:6px}#stage{width:min(620px,90vw);aspect-ratio:720/430;display:block;margin:8px auto;border:5px ridge #c4a065}#frames{display:grid;grid-template-columns:repeat(4,1fr);max-width:1100px;margin:12px auto;gap:8px}figure{margin:0}figure canvas{width:100%;display:block}figcaption{font-size:12px;padding:3px}.controls{display:flex;gap:8px;justify-content:center}a{color:#f3d6a1}@media(max-width:650px){#frames{grid-template-columns:repeat(2,1fr)}}</style></head><body><header id="scenes"></header><main><h1 id="title"></h1><canvas id="stage" width="1080" height="645"></canvas><div class="controls"><button id="play">Пауза</button><button id="slow">Медленно</button><button id="step">Следующая поза</button><a href="index.html?v=8">В игру</a></div><section id="frames" aria-label="Все позы выбранной сцены"></section></main><script src="art.js?v=8"></script><script>
const reviewNames={knightHorse:'Рыцарь скачет на коне.',dwarfTreasure:'Гном нашёл клад.',catHat:'Кот сидит в шляпе.',catMouse:'Кот ловит мышь.',witchFly:'Ведьма летит на метле.',knightSword:'Рыцарь держит меч.',dwarfBag:'Гном несёт мешок.',catYarn:'Кот играет с клубком.'};let chosen='knightHorse',paused=false,slow=false,pose=0,elapsed=0,previous=0,drawn=false;const stage=document.getElementById('stage');
function draw(canvas,time,index){const ctx=canvas.getContext('2d');ctx.setTransform(canvas.width/720,0,0,canvas.height/430,0,0);ctx.clearRect(0,0,720,430);paintFlipbook(ctx,chosen,time,index)}
function thumbnails(){document.getElementById('frames').innerHTML='';for(let i=0;i<flipbooks[chosen].frames;i++){const f=document.createElement('figure'),c=document.createElement('canvas'),label=document.createElement('figcaption');c.width=360;c.height=215;label.textContent='Поза '+(i+1);f.append(c,label);document.getElementById('frames').append(f);draw(c,0,i)}}
function choose(name){chosen=name;elapsed=0;pose=0;drawn=false;document.getElementById('title').textContent=reviewNames[name];document.querySelectorAll('#scenes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===name)))}
for(const [id,label]of Object.entries(reviewNames)){const b=document.createElement('button');b.textContent=label;b.dataset.scene=id;b.onclick=()=>choose(id);document.getElementById('scenes').append(b)}
document.getElementById('play').onclick=()=>{paused=!paused;document.getElementById('play').textContent=paused?'Играть':'Пауза'};document.getElementById('slow').onclick=()=>{slow=!slow;document.getElementById('slow').textContent=slow?'Обычная скорость':'Медленно'};document.getElementById('step').onclick=()=>{paused=true;pose=(pose+1)%flipbooks[chosen].frames;document.getElementById('play').textContent='Играть'};
choose(chosen);function reviewTick(now){const dt=previous?Math.min((now-previous)/1000,.1):0;previous=now;if(paintReady){if(!drawn){thumbnails();drawn=true}if(!paused)elapsed+=dt*(slow?.4:1);draw(stage,elapsed,paused?pose:undefined)}requestAnimationFrame(reviewTick)}requestAnimationFrame(reviewTick);
</script></body></html>
