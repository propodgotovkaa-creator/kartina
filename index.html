<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211d37"><title>Тайна волшебной галереи</title><link rel="stylesheet" href="style.css?v=7"></head>
<body><div class="ambience"></div><div class="grain"></div><header><span class="game-name">Тайна волшебной галереи</span><div class="tools"><button id="galleryBtn" class="quiet">Галерея</button><button id="resetBtn" class="icon-button" aria-label="Начать заново" title="Начать заново">↺</button></div></header>
<main><section id="game" aria-label="Игровое задание"><div class="reading"><div id="steps" class="steps"></div><h2 id="sentence"></h2></div><div class="play-layout"><div class="frame-wrap"><div class="frame-crest" aria-hidden="true">✦</div><div id="frame" class="painting-frame" role="button" tabindex="0" aria-label="Пустая картина. Поместить выбранного героя"><div id="canvas" class="canvas"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div></div></div><aside class="choices-panel"><div id="choices" class="choices"></div></aside></div><div class="bottom"><button id="nextBtn" class="gold-button" hidden>Следующая история <span>→</span></button></div></section><section id="gallery" hidden><div class="gallery-intro"><h2 id="galleryTitle">Ожившие истории</h2></div><div id="galleryGrid" class="gallery-grid"></div><nav class="gallery-nav"><button id="galleryPrev" class="quiet" aria-label="Предыдущий зал">←</button><button id="galleryNext" class="quiet" aria-label="Следующий зал">→</button></nav><button id="backBtn" class="gold-button">Вернуться к истории <span>→</span></button></section></main><dialog id="detail"><button class="close" aria-label="Закрыть картину">×</button><h2 id="detailTitle"></h2><div id="detailScene" class="painting-frame"></div></dialog><dialog id="resetDialog"><h2>Начнём новую историю?</h2><p>Картины снова станут пустыми, а задания перемешаются.</p><div class="dialog-actions"><button id="cancelReset" class="quiet">Продолжить игру</button><button id="confirmReset" class="gold-button">Начать заново</button></div></dialog><script src="art.js?v=7"></script><script src="app.js?v=7"></script></body></html>
