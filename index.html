<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211d37"><title>Тайна волшебной галереи</title><link rel="stylesheet" href="style.css?v=9"></head>
<body><div class="ambience"></div><div class="grain"></div><header><div class="tools"><button id="resetBtn" class="icon-button" aria-label="Начать заново" title="Начать заново" hidden>↺</button></div></header>
<main>
<section id="intro" aria-labelledby="introTitle"><div class="parchment"><span class="parchment-star" aria-hidden="true">✦</span><h1 id="introTitle">Тайна волшебной галереи</h1><p>В волшебном замке герои сбежали со своих картин.</p><p>Читай предложения и верни героев на место.</p><p class="intro-action">Перетащи подходящего героя в картину — и она оживёт!</p><button id="startBtn" class="gold-button">Начать игру <span>→</span></button></div></section>
<section id="game" aria-label="Игровое задание" hidden><div id="reading" class="reading"><h2 id="sentence"></h2></div><div class="play-layout"><div class="frame-wrap"><div id="frame" class="painting-frame" role="button" tabindex="0" aria-label="Пустая картина. Поместить выбранного героя"><div id="canvas" class="canvas"></div></div></div><aside class="choices-panel"><div id="choices" class="choices"></div></aside></div><div class="bottom"><button id="nextBtn" class="gold-button" hidden>Далее <span>→</span></button></div></section>
</main>
<dialog id="finishDialog" class="parchment" aria-labelledby="finishTitle"><span class="parchment-star" aria-hidden="true">✦</span><h2 id="finishTitle">Ты отлично справился!</h2><p>Хочешь ещё?</p><div class="dialog-actions"><button id="againBtn" class="gold-button">Да, ещё!</button><button id="finishNoBtn" class="paper-button">Пока нет</button></div></dialog>
<dialog id="resetDialog"><h2>Начать заново?</h2><p>Картины снова станут пустыми, а задания перемешаются.</p><div class="dialog-actions"><button id="cancelReset" class="quiet">Продолжить игру</button><button id="confirmReset" class="gold-button">Начать заново</button></div></dialog>
<script src="art.js?v=9"></script><script src="app.js?v=9"></script></body></html>
